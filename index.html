<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics II — Electromagnetism &amp; Optics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Spectral (serif/reading) + IBM Plex Sans (UI) + IBM Plex Mono (labels) -->
    <!-- Also Inter (Principia design-system sans) + JetBrains Mono (design-system mono) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>

        <!-- Principia orbit mark (from Shell.jsx Mark component) -->
        <svg class="topbar-mark" width="26" height="26" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="14.5" stroke="currentColor" stroke-width="1.4"/>
          <ellipse cx="20" cy="20" rx="14.5" ry="6" stroke="currentColor" stroke-width="1.2"
                   transform="rotate(-30 20 20)" opacity="0.45"/>
          <circle cx="20" cy="20" r="2.4" fill="currentColor"/>
          <circle cx="31.6" cy="13.2" r="2.6" fill="var(--blue-500)"/>
        </svg>

        <span class="book-title" data-en="Physics II: Electromagnetism &amp; Optics" data-it="Fisica II: Elettromagnetismo &amp; Ottica">
          Physics II: Electromagnetism &amp; Optics
        </span>

        <div class="topbar-controls">
          <button id="lang-toggle" title="Switch language">EN | IT</button>
          <button id="theme-toggle" title="Toggle theme">&#9790;</button>
          <button id="bookmark-toggle" title="Bookmarks" aria-label="Open bookmarks">&#9646;&#9646;</button>
          <button id="margin-toggle" title="Toggle notes" aria-label="Toggle margin notes">&#8942;</button>
        </div>
      </header>

      <div id="reader-shell">
        <nav id="sidebar">
          <div class="sidebar-inner">
            <div class="toc-title" data-en="Contents" data-it="Indice">Contents</div>
            <ul id="toc"></ul>
          </div>
        </nav>

        <main id="content">
          <div id="chapter-view"></div>
        </main>

        <aside id="margin-rail" class="hidden">
          <div class="margin-rail-inner">
            <div class="eyebrow" style="margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line-hair)">IN THE MARGIN</div>
            <div id="margin-notes"></div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Bookmarks panel (Principia Bookmarks.jsx adaptation) -->
    <div id="bookmarks-overlay"></div>
    <aside id="bookmarks-panel" aria-label="Bookmarks">
      <header class="bm-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="bm-title">Bookmarks</span>
        <span class="badge badge-neutral" id="bm-count">0 saved</span>
        <button id="bookmarks-close" class="icon-btn icon-btn-sm" aria-label="Close bookmarks">&#x2715;</button>
      </header>
      <div class="bm-body">
        <div class="bm-section">
          <div class="eyebrow" style="margin-bottom:12px">Saved chapters</div>
          <div id="bm-chapters-list"></div>
        </div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
